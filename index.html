<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks — Rekomendasi</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #FAFAF7;
  color: #1C1810;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
}

/* ── HEADER ── */
#view-home header { padding: 48px 0 0; text-align: center; }
.site-tag {
  display: inline-block; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: #B08050; margin-bottom: 10px;
}
.site-title {
  font-family: 'Lora', serif; font-size: clamp(32px, 5vw, 52px);
  font-weight: 400; line-height: 1.1; margin-bottom: 10px;
}
.site-title em { font-style: italic; color: #B08050; }
.site-sub { font-size: 14px; color: #9A8878; font-weight: 300; margin-bottom: 36px; }

/* ── TABS ── */
.tabs {
  display: flex; justify-content: center; gap: 4px;
  padding: 0 24px 40px; border-bottom: 1px solid #ECEAE4; flex-wrap: wrap;
}
.tab {
  padding: 9px 22px; border-radius: 999px; font-size: 13px;
  font-weight: 400; color: #9A8878; cursor: pointer;
  transition: background .2s, color .2s; border: none;
  background: none; font-family: 'DM Sans', sans-serif;
}
.tab:hover { background: #F0EDE6; color: #4A3020; }
.tab.active { background: #1C1810; color: #FAFAF7; }

/* ── MENU PAGE (QR) ── */
#view-menu { display: none; min-height: 100vh; }
.menu-hero {
  padding: 56px 24px 36px; text-align: center;
  border-bottom: 1px solid #ECEAE4;
}
.menu-hero-icon { font-size: 44px; margin-bottom: 14px; display: block; }
.menu-hero-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #B08050; margin-bottom: 8px; }
.menu-hero-title { font-family: 'Lora', serif; font-size: clamp(28px, 5vw, 44px); font-weight: 400; line-height: 1.1; margin-bottom: 10px; }
.menu-hero-title em { font-style: italic; color: #B08050; }
.menu-hero-sub { font-size: 14px; color: #9A8878; font-weight: 300; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: #B08878; text-decoration: none;
  letter-spacing: 1px; margin-top: 20px; transition: color .2s;
}
.back-link:hover { color: #1C1810; }

/* ── MAIN ── */
main { max-width: 680px; margin: 0 auto; padding: 0 24px 100px; }

.section-label {
  display: flex; align-items: center; gap: 14px; padding: 48px 0 32px;
}
.section-label-icon { font-size: 18px; }
.section-label-text {
  font-family: 'Lora', serif; font-size: 13px;
  font-style: italic; color: #B08050; font-weight: 400;
}
.section-label-line { flex: 1; height: 1px; background: #ECEAE4; }

/* ── ITEM ── */
.item { margin-bottom: 56px; animation: fadeIn .45s ease both; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.item + .item { border-top: 1px solid #F0EDE6; padding-top: 48px; }

/* IMAGE WRAP — klik untuk zoom */
.item-img-wrap {
  width: 100%; aspect-ratio: 16/9;
  border-radius: 14px; overflow: hidden;
  margin-bottom: 20px; background: #EDE6DB;
  position: relative; cursor: zoom-in;
}
.item-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  display: block; transition: transform .5s ease;
}
.item-img-wrap:hover img { transform: scale(1.03); }

/* hint icon klik */
.zoom-hint {
  position: absolute; bottom: 12px; right: 14px;
  background: rgba(28,24,16,0.45);
  backdrop-filter: blur(4px);
  color: rgba(255,255,255,0.85);
  font-size: 11px; letter-spacing: 1px;
  padding: 5px 10px; border-radius: 999px;
  display: flex; align-items: center; gap: 5px;
  opacity: 0; transition: opacity .25s;
  pointer-events: none;
  font-family: 'DM Sans', sans-serif;
}
.item-img-wrap:hover .zoom-hint { opacity: 1; }

/* fallback */
.item-img-wrap .img-fallback {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; font-size: 48px; background: #EDE6DB;
}
.item-img-wrap .img-fallback span {
  font-size: 12px; letter-spacing: 1px;
  text-transform: uppercase; color: #C0B0A0;
  font-family: 'DM Sans', sans-serif;
}
.item-img-wrap img.loaded + .zoom-hint + .img-fallback { display: none; }
.item-img-wrap img.error { display: none; }

/* ── LIGHTBOX ── */
#lightbox {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(18,14,10,0.92);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
  cursor: zoom-out;
}
#lightbox.open {
  opacity: 1; pointer-events: all;
}
#lightbox img {
  max-width: 100%; max-height: 90vh;
  border-radius: 10px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  transform: scale(0.92);
  transition: transform .35s cubic-bezier(.22,1,.36,1);
  object-fit: contain;
}
#lightbox.open img { transform: scale(1); }

#lightbox-caption {
  position: absolute; bottom: 28px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Lora', serif; font-style: italic;
  font-size: 14px; color: rgba(255,255,255,0.45);
  white-space: nowrap;
}

#lightbox-close {
  position: absolute; top: 20px; right: 24px;
  background: rgba(255,255,255,0.1);
  border: none; color: rgba(255,255,255,0.7);
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 18px; cursor: pointer; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
}
#lightbox-close:hover { background: rgba(255,255,255,0.2); }

/* META & TEXT */
.item-meta {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 8px; gap: 12px;
}
.item-num {
  font-family: 'Lora', serif; font-size: 12px;
  color: #D0C4B8; font-style: italic;
}
.item-badge {
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  font-weight: 500; font-family: 'DM Sans', sans-serif;
  padding: 4px 11px; border-radius: 999px;
}
.b-must { background: #FBE9D6; color: #9A4A10; }
.b-new  { background: #DFF0E4; color: #1A6032; }
.b-love { background: #FAE0E8; color: #8C2040; }
.item-name {
  font-family: 'Lora', serif; font-size: 22px;
  font-weight: 500; color: #1C1810; line-height: 1.2; margin-bottom: 10px;
}
.item-flavor { font-size: 14.5px; color: #6A5848; line-height: 1.75; font-weight: 300; }
.item-flavor strong { color: #1C1810; font-weight: 500; }
.item-tags { display: flex; gap: 7px; margin-top: 14px; flex-wrap: wrap; }
.itag { font-size: 11px; color: #B08878; background: #F5F1EB; padding: 3px 10px; border-radius: 4px; }

.group { display: none; }
.group.active { display: block; }

/* ── FOOTER ── */
footer { text-align: center; padding: 36px 24px 56px; border-top: 1px solid #ECEAE4; }
footer p { font-size: 12px; color: #C0B4A8; line-height: 1.8; }
footer em { font-family: 'Lora', serif; font-style: italic; color: #B08050; }
</style>
</head>

/* ═══════════════════════ LIGHTBOX ═══════════════════════ */
function openLightbox(src, alt) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  const cap = document.getElementById('lightbox-caption');
  img.src = src;
  img.alt = alt;
  cap.textContent = alt;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

// tutup dengan Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// cegah klik di dalam gambar nutup lightbox
document.getElementById('lightbox-img').addEventListener('click', e => e.stopPropagation());

/* ═══════════════════════ RENDER ═══════════════════════ */
function renderItems(items) {
  return items.map(it => `
    <div class="item">
      <div class="item-img-wrap" onclick="openLightbox('${it.img}', '${it.imgAlt}')">
        <img
          src="${it.img}"
          alt="${it.imgAlt}"
          loading="lazy"
          onload="this.classList.add('loaded')"
          onerror="this.classList.add('error')"
        >
        <div class="zoom-hint">🔍 lihat foto</div>
        <div class="img-fallback">
          <span>📷</span>
          <span>foto belum tersedia</span>
        </div>
      </div>
      <div class="item-meta">
        <span class="item-num">${it.num}</span>
        ${it.badge ? `<span class="item-badge ${it.badge}">${it.badgeText}</span>` : ''}
      </div>
      <p class="item-name">${it.name}</p>
      <p class="item-flavor">${it.flavor}</p>
      <div class="item-tags">${it.tags.map(t => `<span class="itag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

/* ═══════════════════════ ROUTER ═══════════════════════ */
const param = new URLSearchParams(window.location.search).get('menu');

if (param && DATA[param]) {
  const d = DATA[param];
  document.title = `Picks — ${d.icon} ${param[0].toUpperCase()+param.slice(1)}`;
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-menu').style.display = 'block';
  document.getElementById('menu-hero').innerHTML = `
    <span class="menu-hero-icon">${d.icon}</span>
    <p class="menu-hero-label">${d.label}</p>
    <h1 class="menu-hero-title">${d.title}</h1>
    <p class="menu-hero-sub">${d.sub}</p>
    <a class="back-link" href="./">← semua menu</a>
  `;
  document.getElementById('menu-items').innerHTML = renderItems(d.items);
} else {
  Object.entries(DATA).forEach(([cat, d]) => {
    const el = document.getElementById('g-' + cat);
    if (el) el.insertAdjacentHTML('beforeend', renderItems(d.items));
  });
}

/* ═══════════════════════ TAB FILTER ═══════════════════════ */
function showGroup(cat, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.group').forEach(g => {
    const show = cat === 'semua' || g.dataset.cat === cat;
    g.classList.toggle('active', show);
    g.style.display = show ? 'block' : 'none';
  });
}
</script>
