<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks — Rekomendasi Hari Ini</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #FAFAF7;
  color: #1C1810;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
}

/* HEADER */
header {
  padding: 40px 0 0;
  text-align: center;
}

.site-tag {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #B08050;
}

.site-title {
  font-family: 'Lora', serif;
  font-size: 42px;
  margin: 10px 0;
}

.site-sub {
  font-size: 14px;
  color: #9A8878;
  margin-bottom: 30px;
}

/* TABS */
.tabs {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 30px;
}

.tab {
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

.tab.active {
  background: #1C1810;
  color: white;
}

/* GROUP */
.group { display: none; }
.group.active { display: block; }

main {
  max-width: 600px;
  margin: auto;
}

/* ITEM */
.item {
  padding: 16px;
  border-bottom: 1px solid #eee;
}

.item-name {
  font-weight: bold;
  font-size: 18px;
}

.item-flavor {
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <div class="site-tag">pilihan hari ini</div>
  <h1 class="site-title">Menu Rekomendasi</h1>
  <p class="site-sub">Scan QR untuk melihat kategori</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="show('semua', this)">Semua</button>
  <button class="tab" onclick="show('kopi', this)">☕ Kopi</button>
  <button class="tab" onclick="show('smoothie', this)">🥤 Smoothie</button>
  <button class="tab" onclick="show('kue', this)">🍰 Kue</button>
</div>

<main>

<!-- KOPI -->
<div class="group active" id="g-kopi">
  <div class="item">
    <div class="item-name">Kopi Gula Aren</div>
    <div class="item-flavor">Manis hangat dengan aroma karamel</div>
  </div>
</div>

<!-- SMOOTHIE -->
<div class="group active" id="g-smoothie">
  <div class="item">
    <div class="item-name">Tropical Mango</div>
    <div class="item-flavor">Segar dan manis alami</div>
  </div>
</div>

<!-- KUE -->
<div class="group active" id="g-kue">
  <div class="item">
    <div class="item-name">Cheesecake</div>
    <div class="item-flavor">Lembut dan creamy</div>
  </div>
</div>

</main>

<script>
function show(cat, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const groups = document.querySelectorAll('.group');

  if (cat === 'semua') {
    groups.forEach(g => g.style.display = 'block');
    return;
  }

  groups.forEach(g => {
    if (g.id === 'g-' + cat) {
      g.style.display = 'block';
    } else {
      g.style.display = 'none';
    }
  });
}

// AUTO FILTER DARI QR
const params = new URLSearchParams(window.location.search);
const cat = params.get("cat");

if (cat) {
  const btn = document.querySelector(`.tab[onclick*="${cat}"]`);
  if (btn) {
    show(cat, btn);
  }
}
</script>

</body>
</html>
